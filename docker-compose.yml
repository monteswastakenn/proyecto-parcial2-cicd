# Stack del proyecto. En CI solo se levantan db, auditoria, api y web;
# en EC2 se agrega el perfil "observabilidad" (OpenObserve + OpenTelemetry Collector + sensores).
name: proyecto

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://host.docker.internal:4318}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  NODE_ENV: ${NODE_ENV:-production}
  APP_VERSION: ${APP_VERSION:-dev}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20

  auditoria:
    build: ./auditoria
    restart: unless-stopped
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: auditoria
      DATABASE_URL: postgres://app:${DB_PASSWORD:-app}@db:5432/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: api
      DATABASE_URL: postgres://app:${DB_PASSWORD:-app}@db:5432/app
      AUDITORIA_URL: http://auditoria:4000
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@proyecto.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      retries: 30

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  openobserve:
    profiles: ["observabilidad"]
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OO_USER:-admin@proyecto.com}
      ZO_ROOT_USER_PASSWORD: ${OO_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "128"
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"   # el disco de la EC2 es de 8 GB
    ports:
      - "${OO_PORT:-6061}:5080"
    volumes:
      - oodata:/data

  otel-collector:
    profiles: ["observabilidad"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    network_mode: host   # necesario para leer CPU, memoria y red reales del servidor
    environment:
      OO_ENDPOINT: http://127.0.0.1:${OO_PORT:-6061}/api/default
      OO_AUTH: ${OO_AUTH:-}
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    depends_on:
      - openobserve

  sensores:
    profiles: ["observabilidad"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/sensores.sh"]
    environment:
      OO_ENDPOINT: http://127.0.0.1:${OO_PORT:-6061}/api/default
      OO_AUTH: ${OO_AUTH:-}
    volumes:
      - ./monitoring/sensores.sh:/sensores.sh:ro
      - /sys:/host/sys:ro
    depends_on:
      - openobserve

volumes:
  pgdata:
  oodata:
