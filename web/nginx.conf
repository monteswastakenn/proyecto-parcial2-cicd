server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: el nombre "api" se resuelve en cada peticion, asi nginx
  # sigue funcionando cuando el contenedor de la API se recrea en un despliegue.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  # La API se expone bajo /api en el mismo dominio
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    # El navegador debe revisar siempre si hay una version nueva (cada despliegue cambia el frontend)
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
