<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Inventario</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Vista de inicio de sesion -->
  <main id="vista-login" class="login" hidden>
    <form id="form-login" class="tarjeta login-tarjeta" novalidate>
      <h1>Sistema de Inventario</h1>
      <p class="sub">Inicia sesión para continuar</p>
      <div id="login-error" class="alerta" role="alert" hidden></div>
      <label for="login-email">Correo</label>
      <input id="login-email" name="email" type="email" autocomplete="username" placeholder="admin@proyecto.com">
      <small class="error-campo" data-error="email"></small>
      <label for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password">
      <small class="error-campo" data-error="password"></small>
      <button type="submit" id="btn-login" class="primario">Entrar</button>
    </form>
  </main>

  <!-- Aplicacion -->
  <div id="vista-app" hidden>
    <header class="barra">
      <strong>Inventario</strong>
      <nav>
        <a href="#/usuarios" data-nav="usuarios">Usuarios</a>
        <a href="#/productos" data-nav="productos">Productos</a>
      </nav>
      <span id="usuario-actual"></span>
      <button id="btn-logout" class="secundario">Cerrar sesión</button>
    </header>

    <section class="contenido">
      <div class="encabezado">
        <h2 id="titulo-seccion"></h2>
        <input id="buscar" type="search" placeholder="Buscar..." aria-label="Buscar">
        <button id="btn-nuevo" class="primario">Nuevo</button>
      </div>
      <table id="tabla">
        <thead id="tabla-encabezado"></thead>
        <tbody id="tabla-cuerpo"></tbody>
      </table>
      <p id="sin-registros" class="vacio" hidden>No hay registros</p>
      <p id="contador" class="contador"></p>
    </section>
  </div>

  <!-- Formulario modal (crear / editar) -->
  <dialog id="modal-form">
    <form id="form-registro" method="dialog" novalidate>
      <h3 id="modal-titulo"></h3>
      <div id="campos"></div>
      <div id="form-error" class="alerta" role="alert" hidden></div>
      <div class="acciones">
        <button type="button" id="btn-cancelar" class="secundario">Cancelar</button>
        <button type="submit" id="btn-guardar" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmacion de borrado -->
  <dialog id="modal-confirmar">
    <p id="confirmar-texto"></p>
    <div class="acciones">
      <button type="button" id="btn-no" class="secundario">Cancelar</button>
      <button type="button" id="btn-si" class="peligro">Eliminar</button>
    </div>
  </dialog>

  <div id="toast" role="status" hidden></div>
  <footer id="pie-version">Versión desplegada: <span id="version">…</span></footer>
  <script src="/app.js"></script>
</body>
</html>
