# Pipeline CI/CD: pruebas (Jest + Playwright) -> despliegue en AWS EC2 solo si todas pasan.
# Cada ejecucion y cada despliegue se registran en OpenObserve (API HTTP/JSON).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  OO_URL: ${{ secrets.OO_URL }}
  OO_AUTH: ${{ secrets.OO_AUTH }}
  COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'ejecucion manual' }}

jobs:
  pruebas:
    name: Pruebas (Jest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            e2e/package-lock.json

      - name: Levantar el sistema (PostgreSQL, auditoria, API y web)
        env:
          OTEL_SDK_DISABLED: "true"
        run: docker compose up -d --build --wait db auditoria api web

      - name: Pruebas de backend (Jest + Supertest)
        working-directory: api
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app
        run: |
          npm ci
          npx jest --ci --runInBand --json --outputFile=jest-resultados.json

      - name: Instalar Playwright y Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pruebas E2E (Playwright - API y frontend)
        working-directory: e2e
        env:
          BASE_URL: http://localhost
        run: npx playwright test

      - name: Logs de los contenedores (solo si algo fallo)
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            e2e/reporte-playwright
            api/jest-resultados.json
          retention-days: 14

      - name: Registrar resultado en OpenObserve
        if: always()
        run: bash scripts/evento-openobserve.sh pruebas "${{ job.status }}"

  despliegue:
    name: Despliegue en AWS EC2
    needs: pruebas
    # Solo se ejecuta si TODAS las pruebas pasaron y es un push a main.
    # Si "pruebas" falla, este job se omite y nunca se abre la conexion SSH.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Actualizar contenedores en EC2
        run: ssh -i ~/.ssh/deploy ubuntu@${{ secrets.EC2_HOST }} "bash ~/proyecto-parcial2/scripts/desplegar.sh ${{ github.sha }}"

      - name: Verificar el sistema desplegado
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "http://${{ secrets.EC2_HOST }}/api/health"
          echo
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" "http://${{ secrets.EC2_HOST }}/"

      - name: Registrar despliegue en OpenObserve
        if: always()
        env:
          DESTINO: ${{ secrets.EC2_HOST }}
        run: bash scripts/evento-openobserve.sh despliegue "${{ job.status }}"
